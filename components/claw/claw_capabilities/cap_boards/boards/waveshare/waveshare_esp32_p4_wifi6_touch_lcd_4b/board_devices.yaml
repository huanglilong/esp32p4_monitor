version: 1.0.0
# Devices Configuration for ESP32-P4-WIFI6-Touch-LCD-4B
# Hardware: MIPI DSI 720x720 ST7703, MIPI CSI OV5647, ES8311+ES7210,
#           ESP32-C6 WiFi (SDIO), SDSPI SD Card, GT911 Touch
devices:
  # Audio DAC via ES8311 codec (speaker output)
  - name: audio_dac
    chip: es8311
    type: audio_codec
    version: default
    config:
      dac_enabled: true
      dac_max_channel: 2
      dac_channel_mask: "11"
      mclk_enabled: true
    peripherals:
      - name: gpio_pa_control
        gain: 6
        active_level: 1
      - name: i2s_audio_out
      - name: i2c_master
        address: 0x30   # ES8311 8-bit addr (7-bit: 0x18)

  # Audio ADC via ES7210 codec (dual mic input)
  - name: audio_adc
    chip: es7210
    type: audio_codec
    version: default
    config:
      adc_enabled: true
      adc_max_channel: 2
      adc_channel_mask: "11"
      adc_channel_labels: [L_MIC, R_MIC]
      mclk_enabled: true
    peripherals:
      - name: i2s_audio_in
      - name: i2c_master
        address: 0x82   # ES7210 8-bit addr (7-bit: 0x41)

  # SD Card via SDSPI (SDMMC slot 0 used by C6 SDIO)
  - name: fs_sdcard
    type: fs_fat
    sub_type: sdspi
    version: default
    config:
      sub_config:
        slot: SDSPI_HOST
        frequency: 20000000
        pins:
          clk: 43
          cmd: 44
          d0: 39
          d1: 40
          d2: 41
          d3: 42
        ldo_chan_id: 4

  # DSI Display (ST7703 720x720)
  - name: display_lcd
    chip: st7703
    type: display_lcd
    sub_type: dsi
    dependencies:
      waveshare/esp_lcd_st7703: "^2.0.0"
    config:
      reset_gpio_num: -1
      rgb_ele_order: LCD_RGB_ELEMENT_ORDER_RGB
      data_endian: LCD_RGB_DATA_ENDIAN_LITTLE
      bits_per_pixel: 16
      reset_active_high: 0
      dpi_config:
        virtual_channel: 0
        dpi_clk_src: MIPI_DSI_DPI_CLK_SRC_DEFAULT
        dpi_clock_freq_mhz: 48
        pixel_format: LCD_COLOR_PIXEL_FORMAT_RGB565
        in_color_format: LCD_COLOR_FMT_RGB565
        out_color_format: LCD_COLOR_FMT_RGB565
        num_fbs: 1
        flags:
          use_dma2d: false
          disable_lp: false
        video_timing:
          h_size: 720
          v_size: 720
          hsync_back_porch: 40
          hsync_pulse_width: 10
          hsync_front_porch: 40
          vsync_back_porch: 20
          vsync_pulse_width: 1
          vsync_front_porch: 20
      peripherals:
        - name: ldo_mipi
        - name: dsi_display

  # Touch Panel (GT911)
  - name: lcd_touch
    chip: gt911
    type: lcd_touch
    sub_type: i2c
    version: default
    dependencies:
      espressif/esp_lcd_touch_gt911: "*"
    config:
      io_i2c_config:
        lcd_cmd_bits: 16
      touch_config:
        x_max: 720
        y_max: 720
        flags:
          mirror_x: false
          mirror_y: false
    peripherals:
      - name: i2c_master
        i2c_addr: [0xBA, 0x28]

  # LCD Backlight via LEDC PWM
  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    peripherals:
      - name: ledc_backlight

  # MIPI CSI Camera (OV5647)
  - name: camera
    type: camera
    version: default
    sub_type: "csi"
    config:
      csi_config:
        reset_io: -1
        pwdn_io: -1
        dont_init_ldo: true
    peripherals:
      - name: "i2c_master"
        frequency: 100000
      - name: ldo_mipi

  # Buttons
  - name: buttons
    chip: gpio_button
    type: custom
    version: 1.0.0
    init_skip: true
    config:
      button_boot_gpio: 35
      active_level: 0

  # System LED
  - name: system_led
    chip: gpio_led
    type: custom
    version: 1.0.0
    init_skip: true
    config:
      gpio_num: 23
      active_level: 1
